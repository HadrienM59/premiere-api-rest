version: '3'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: userdb
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-base.sql:/docker-entrypoint-initdb.d/init-base.sql:ro

    ports:
      - "54321:5432"
volumes:
  db-data: